<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEOSFERA — Glosario</title>
  <link rel="icon" type="image/png" href="/imagenes/MundoIcono.png">
  <link rel="stylesheet" href="/css/estilos.css">
  <script>(function(){var t=localStorage.getItem('tema')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body>

<header>
  <h1>GEOSFERA</h1>
  <nav>
    <a href="/inicio">Inicio</a>
    <a href="/glosario" class="activo">Glosario</a>
    <a href="/fuentes">Fuentes</a>
    <a href="/scraper" class="nav-solo-admin">Scraper</a>
  </nav>
  <button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema">☀</button>
  <div id="nav-auth"></div>
</header>

<main>
  <div class="seccion-header">
    <h2>Glosario geopolítico</h2>
    <button class="btn-add" id="btn-add" onclick="abrirModal()">+ Nuevo término</button>
  </div>
  <div class="barra-filtros">
    <input type="text" id="buscador" placeholder="Buscar término o definición…" oninput="filtrarDebounce()">
    <select id="filtro-categoria" onchange="aplicarFiltros()">
      <option value="">Todas las categorías</option>
    </select>
  </div>
  <div id="lista-glosario">Cargando términos…</div>
  <div id="paginacion-info" class="paginacion-info"></div>
  <div id="paginacion" class="paginacion"></div>
</main>

<!-- Modal término -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-titulo">Nuevo término</h3>
    <div class="alerta" id="modal-alerta"></div>
    <form onsubmit="submitTermino(event)">
      <input type="hidden" id="t-id">
      <div class="grid-2">
        <div class="fg"><label>Emoji</label><input type="text" id="t-emoji" placeholder="🌍" style="text-align:center"></div>
        <div class="fg"><label>Nombre *</label><input type="text" id="t-nombre" required></div>
      </div>
      <div class="fg"><label>Definición *</label><textarea id="t-definicion" required></textarea></div>
      <div class="fg"><label>Categoría</label>
        <select id="t-categoria">
          <option value="">Sin categoría</option>
        </select>
      </div>
      <div class="fg"><label>Relacionados</label><input type="text" id="t-relacionados" placeholder="Separados por coma"></div>
      <div class="modal-footer">
        <button type="button" class="btn-m sec" onclick="cerrarModal('modal')">Cancelar</button>
        <button type="submit" class="btn-m pri">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  let usuario = null
  let listaCategorias = []

  //  Paginación 
  const POR_PAGINA   = 30
  let paginaActual   = 1
  let totalPaginas   = 1
  let totalTerminos  = 0
  let buscadorTimer  = null

  function aplicarFiltros() {
    paginaActual = 1
    cargarGlosario()
  }

  function filtrarDebounce() {
    clearTimeout(buscadorTimer)
    buscadorTimer = setTimeout(() => { paginaActual = 1; cargarGlosario() }, 300)
  }

  function irPagina(p) {
    if (p < 1 || p > totalPaginas || p === paginaActual) return
    paginaActual = p
    cargarGlosario()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }

  function paginasAMostrar(actual, total) {
    if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1)
    const set   = new Set([1, total, actual, actual - 1, actual + 1])
    const orden = [...set].filter(p => p >= 1 && p <= total).sort((a, b) => a - b)
    const result = []
    for (let i = 0; i < orden.length; i++) {
      if (i > 0 && orden[i] - orden[i - 1] > 1) result.push('...')
      result.push(orden[i])
    }
    return result
  }

  function renderPaginacion() {
    const el = document.getElementById('paginacion')
    if (totalPaginas <= 1) { el.innerHTML = ''; return }
    const paginas = paginasAMostrar(paginaActual, totalPaginas)
    el.innerHTML = `
      <button class="pag-btn" ${paginaActual === 1 ? 'disabled' : ''} onclick="irPagina(${paginaActual - 1})">‹ Anterior</button>
      ${paginas.map(p => p === '...'
        ? `<span class="pag-ellipsis">…</span>`
        : `<button class="pag-btn ${p === paginaActual ? 'activa' : ''}" onclick="irPagina(${p})">${p}</button>`
      ).join('')}
      <button class="pag-btn" ${paginaActual === totalPaginas ? 'disabled' : ''} onclick="irPagina(${paginaActual + 1})">Siguiente ›</button>
    `
  }

  // ── Auth ───────────────────────────────────────────────────────────────────
  async function iniciar() {
    try {
      const res = await fetch('/api/auth/me', { credentials:'include' })
      if (res.ok) { usuario = await res.json(); renderNavUsuario() }
      else { window.location.replace('/login'); return }
    } catch { window.location.replace('/login'); return }
    await cargarCategorias()
    cargarGlosario()
  }

  function renderNavUsuario() {
    document.getElementById('nav-auth').innerHTML = `
      <div class="nav-user">
        ${usuario.rol === 'admin' ? '<span class="badge-admin">admin</span>' : ''}
        <span>${usuario.nombre}</span>
        <button class="nav-auth-btn" onclick="doLogout()">Salir</button>
      </div>`
    if (usuario.rol === 'admin')
      document.querySelectorAll('.nav-solo-admin').forEach(el => el.style.display = 'inline')
  }

  async function doLogout() {
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' })
    usuario = null; window.location.href = '/'
  }

  // ── Selector de categorías ─────────────────────────────────────────────────
  async function cargarCategorias() {
    try {
      const res  = await fetch('/api/glosario/categorias', { credentials:'include' })
      const cats = await res.json()
      listaCategorias = cats
      const selFiltro = document.getElementById('filtro-categoria')
      const selModal  = document.getElementById('t-categoria')
      cats.forEach(c => {
        ;[selFiltro, selModal].forEach(sel => {
          const opt = document.createElement('option')
          opt.value = c; opt.textContent = c
          sel.appendChild(opt)
        })
      })
    } catch {}
  }

  // ── Carga paginada ─────────────────────────────────────────────────────────
  async function cargarGlosario() {
    const contenedor = document.getElementById('lista-glosario')
    contenedor.innerHTML = '<p style="color:var(--text2)">Cargando…</p>'

    const q         = document.getElementById('buscador').value.trim()
    const categoria = document.getElementById('filtro-categoria').value
    const offset    = (paginaActual - 1) * POR_PAGINA

    const params = new URLSearchParams({ limite: POR_PAGINA, offset })
    if (q)         params.set('q', q)
    if (categoria) params.set('categoria', categoria)

    try {
      const res  = await fetch(`/api/glosario/?${params}`, { credentials:'include' })
      const data = await res.json()
      if (!res.ok) {
        contenedor.innerHTML = `<p style="color:var(--rojo)">Error: ${data.error || res.status}</p>`
        return
      }

      const list = data.terminos || []
      totalTerminos = data.total ?? list.length
      totalPaginas  = data.total_paginas ?? 1

      if (totalTerminos > 0 && paginaActual > totalPaginas) {
        paginaActual = totalPaginas
        return cargarGlosario()
      }

      if (usuario?.rol === 'admin') document.getElementById('btn-add').classList.add('visible')

      renderTerminos(list)
      renderPaginacion()
    } catch (err) {
      contenedor.innerHTML = `<p style="color:var(--rojo)">Error: ${err.message}</p>`
    }
  }

  function renderTerminos(list) {
    const contenedor = document.getElementById('lista-glosario')
    if (!list.length) { contenedor.innerHTML = '<p style="color:var(--text2)">No hay términos que coincidan.</p>'; return }
    const esAdmin = usuario?.rol === 'admin'
    contenedor.innerHTML = list.map(t => `
      <div class="tarjeta-termino">
        <div class="termino-header">
          ${t.emoji ? `<span class="emoji">${t.emoji}</span>` : ''}
          <h3>${t.nombre}</h3>
          ${t.categoria ? `<span class="categoria">${t.categoria}</span>` : ''}
        </div>
        <p>${t.definicion || ''}</p>
        ${t.relacionados?.length ? `<div class="relacionados">${Array.isArray(t.relacionados) ? t.relacionados.join(', ') : t.relacionados}</div>` : ''}
        ${esAdmin ? `<div class="admin-acciones visible">
          <button class="btn-admin btn-editar" data-id="${t.id}">✏️ Editar</button>
          <button class="btn-admin danger btn-eliminar" data-id="${t.id}">🗑️ Eliminar</button>
        </div>` : ''}
      </div>`).join('')

    if (esAdmin) {
      contenedor.querySelectorAll('.btn-editar').forEach(b =>
        b.addEventListener('click', () => editarTermino(b.dataset.id))
      )
      contenedor.querySelectorAll('.btn-eliminar').forEach(b =>
        b.addEventListener('click', () => eliminarTermino(b.dataset.id))
      )
    }
  }

  // ── CRUD modal ─────────────────────────────────────────────────────────────
  function abrirModal(t = null) {
    document.getElementById('modal-titulo').textContent = t ? 'Editar término' : 'Nuevo término'
    document.getElementById('t-id').value          = t?.id || ''
    document.getElementById('t-emoji').value       = t?.emoji || ''
    document.getElementById('t-nombre').value      = t?.nombre || ''
    document.getElementById('t-definicion').value  = t?.definicion || ''
    document.getElementById('t-categoria').value   = t?.categoria || ''
    // Si la categoría del término no está en la lista (término antiguo), añadirla temporalmente
    const selCat = document.getElementById('t-categoria')
    if (t?.categoria && !selCat.querySelector(`option[value="${t.categoria}"]`)) {
      const opt = document.createElement('option')
      opt.value = t.categoria; opt.textContent = t.categoria
      selCat.appendChild(opt)
      selCat.value = t.categoria
    }
    const rel = t?.relacionados
    document.getElementById('t-relacionados').value = Array.isArray(rel) ? rel.join(', ') : (rel || '')
    document.getElementById('modal').classList.add('open')
  }

  async function editarTermino(id) {
    try {
      const res = await fetch(`/api/glosario/${id}`, { credentials:'include' })
      const data = await res.json()
      if (res.ok) abrirModal(data)
      else alert(data.error || 'No se pudo cargar el término')
    } catch (err) { alert('Error de conexión: ' + err.message) }
  }

  async function submitTermino(e) {
    e.preventDefault()
    const id = document.getElementById('t-id').value
    const body = {
      emoji:        document.getElementById('t-emoji').value,
      nombre:       document.getElementById('t-nombre').value,
      definicion:   document.getElementById('t-definicion').value,
      categoria:    document.getElementById('t-categoria').value || 'General',
      relacionados: document.getElementById('t-relacionados').value,
    }
    try {
      const res = await fetch(id ? `/api/glosario/${id}` : '/api/glosario/', {
        method: id ? 'PUT' : 'POST', credentials:'include',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      })
      const data = await res.json()
      if (res.ok) { cerrarModal('modal'); cargarGlosario() }
      else showAlerta('modal-alerta', data.error || 'Error al guardar', 'error')
    } catch (err) {
      showAlerta('modal-alerta', 'Error de conexión: ' + err.message, 'error')
    }
  }

  async function eliminarTermino(id) {
    if (!confirm('¿Eliminar este término?')) return
    try {
      const res = await fetch(`/api/glosario/${id}`, { method:'DELETE', credentials:'include' })
      if (res.ok) cargarGlosario()
      else { const data = await res.json(); alert(data.error || 'No se pudo eliminar') }
    } catch (err) { alert('Error de conexión: ' + err.message) }
  }

  function cerrarModal(id) { document.getElementById(id).classList.remove('open') }

  function showAlerta(id, msg, tipo) {
    const el = document.getElementById(id)
    el.textContent = msg; el.className = `alerta ${tipo} show`
    setTimeout(() => el.classList.remove('show'), 4000)
  }

  document.querySelectorAll('.modal-overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open') })
  )

  iniciar()

  function toggleTema() {
    const html = document.documentElement
    const nuevo = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
    html.setAttribute('data-theme', nuevo)
    localStorage.setItem('tema', nuevo)
    document.getElementById('btn-tema').textContent = nuevo === 'light' ? '☾' : '☀'
  }
  document.getElementById('btn-tema').textContent =
    document.documentElement.getAttribute('data-theme') === 'light' ? '☾' : '☀'

</script>
</body>
</html>
