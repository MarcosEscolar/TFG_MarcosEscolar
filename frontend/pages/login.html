<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEOSFERA — Acceso</title>
  <link rel="icon" type="image/png" href="/imagenes/MundoIcono.png">
  <link rel="stylesheet" href="/css/estilos.css">
  <script>(function(){var t=localStorage.getItem('tema')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body class="login-body">

<header>
  <h1>GEOSFERA</h1>
  <button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema">☀</button>
</header>

<main class="login-main">
  <div class="login-card">
    <h2>Acceso</h2>
    <p class="subtitulo">Inicia sesión o crea una cuenta para continuar.</p>

    <div class="tab-row">
      <button class="tab-btn activo" id="tab-login" onclick="cambiarTab('login')">Iniciar sesión</button>
      <button class="tab-btn"        id="tab-reg"   onclick="cambiarTab('registro')">Crear cuenta</button>
    </div>

    <div id="alerta" class="alerta"></div>

    <!-- Formulario login -->
    <form id="form-login" onsubmit="doLogin(event)">
      <div class="fg">
        <label>Email</label>
        <input type="email" id="l-email" required placeholder="tu@email.com">
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="l-pass" required placeholder="••••••••">
          <button type="button" class="pass-toggle" onclick="togglePass('l-pass', this)" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>


    <!-- Formulario registro -->
    <form id="form-reg" onsubmit="doRegister(event)" style="display:none">
      <div class="fg">
        <label>Nombre</label>
        <input type="text" id="r-nombre" required placeholder="Tu nombre">
      </div>
      <div class="fg">
        <label>Email</label>
        <input type="email" id="r-email" required placeholder="tu@email.com">
      </div>
      <div class="fg">
        <label>Contraseña <span style="font-weight:400;text-transform:none;letter-spacing:0">(mín. 8 caracteres)</span></label>
        <div class="pass-wrap">
          <input type="password" id="r-pass" required minlength="8" placeholder="••••••••">
          <button type="button" class="pass-toggle" onclick="togglePass('r-pass', this)" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>
  </div>


</main>

<script>
  function rellenar(email, pass) {
    document.getElementById('l-email').value = email
    document.getElementById('l-pass').value  = pass
    cambiarTab('login')
  }

  function cambiarTab(tab) {
    const esLogin = tab === 'login'
    document.getElementById('form-login').style.display  = esLogin ? '' : 'none'
    document.getElementById('form-reg').style.display    = esLogin ? 'none' : ''
    document.getElementById('tab-login').className = `tab-btn ${esLogin ? 'activo' : ''}`
    document.getElementById('tab-reg').className   = `tab-btn ${!esLogin ? 'activo' : ''}`
    // El bloque de prueba y el divider solo se muestran en login
    document.querySelector('.divider').style.display      = esLogin ? '' : 'none'
    document.querySelector('.prueba-bloque').style.display = esLogin ? '' : 'none'
    ocultarAlerta()
  }

  function togglePass(inputId, btn) {
    const input = document.getElementById(inputId)
    const oculta = input.type === 'password'
    input.type = oculta ? 'text' : 'password'
    btn.textContent = oculta ? 'Ocultar' : 'Mostrar'
    btn.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña')
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById('alerta')
    el.textContent = msg
    el.className   = `alerta ${tipo} show`
  }

  function ocultarAlerta() {
    document.getElementById('alerta').className = 'alerta'
  }

  async function doLogin(e) {
    e.preventDefault()
    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('l-email').value,
          password: document.getElementById('l-pass').value
        })
      })
      let data = {}
      try { data = await res.json() } catch { mostrarAlerta('El servidor no respondió con JSON. Revisa la consola.', 'error'); return }
      if (!res.ok) { mostrarAlerta(data.error || 'Error desconocido', 'error'); return }
      window.location.href = '/inicio'
    } catch (err) {
      mostrarAlerta('Error de conexión: ' + err.message, 'error')
    }
  }


  async function doRegister(e) {
    e.preventDefault()
    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nombre:   document.getElementById('r-nombre').value,
          email:    document.getElementById('r-email').value,
          password: document.getElementById('r-pass').value
        })
      })
      let data = {}
      try { data = await res.json() } catch { mostrarAlerta('El servidor no respondió con JSON. Revisa la consola.', 'error'); return }
      if (!res.ok) { mostrarAlerta(data.error || 'Error desconocido', 'error'); return }
      mostrarAlerta('Cuenta creada correctamente. Redirigiendo…', 'ok')
      setTimeout(() => window.location.href = '/inicio', 1200)
    } catch (err) {
      mostrarAlerta('Error de conexión: ' + err.message, 'error')
    }
  }

  function toggleTema() {
    const html = document.documentElement
    const nuevo = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
    html.setAttribute('data-theme', nuevo)
    localStorage.setItem('tema', nuevo)
    document.getElementById('btn-tema').textContent = nuevo === 'light' ? '☾' : '☀'
  }
  document.getElementById('btn-tema').textContent =
    document.documentElement.getAttribute('data-theme') === 'light' ? '☾' : '☀'
</script>
</body>
